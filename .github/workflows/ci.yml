# Kontrola kódu a testy (Linux, levné minuty) při každém odeslání do main.
name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - name: Firebase konfigurace (z tajných nastavení repozitáře)
        env:
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
        run: echo "$FIREBASE_OPTIONS_DART" | base64 --decode > lib/firebase_options.dart
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
