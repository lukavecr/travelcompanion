# Sestavení aplikace pro iPhone na Macu v cloudu (GitHub Actions).
# Výsledek: ComesViae.ipa (nepodepsaná) – do iPhonu ji nahraje Sideloadly s Apple ID.
# Spuštění: GitHub → Actions → „iPhone (IPA)“ → Run workflow.
# Pozor: macOS minuty se v soukromém repozitáři počítají 10× (zdarma ~200 min/měsíc ≈ 8–10 sestavení).
name: iPhone (IPA)

on:
  workflow_dispatch:

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - run: flutter pub get

      - name: Sestavit pro iPhone (bez podpisu – podepíše Sideloadly)
        run: flutter build ios --release --no-codesign

      - name: Zabalit do .ipa
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry ComesViae.ipa Payload
          ls -lh ComesViae.ipa

      - uses: actions/upload-artifact@v6
        with:
          name: ComesViae-iPhone
          path: ComesViae.ipa
          retention-days: 14
